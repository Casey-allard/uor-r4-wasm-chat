[package]
name = "uor_r4_wasm_bridge"
version = "3.0.0"
edition = "2021"
description = "UOR-R4 Geometric Cognitive AI: In-Browser WebGPU Neural Substrate with 8D Gosset E8 Lattice & Hopf Phase Telemetry"
repository = "https://github.com/Casey-allard/uor-r4-wasm-chat"
license = "MIT"
default-run = "uor"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower = "0.4"
regex = "1.10"
futures = "0.3"
async-stream = "0.3"
chrono = "0.4"


[[bin]]
name = "package_models"
path = "src/bin/package_models.rs"

[[bin]]
name = "uor_server"
path = "src/bin/uor_server.rs"

[[bin]]
name = "uor_chatbot"
path = "src/bin/uor_chatbot.rs"

[profile.release]
opt-level = 3          # High performance native optimization
lto = true             # Enable Link-Time Optimization
codegen-units = 1      # Force single code-generation unit for vectorisation
panic = "abort"        # Minimal binary footprint

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

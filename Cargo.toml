[package]
name = "uor_r4_wasm_bridge"
version = "2.0.0"
edition = "2021"
description = "UOR-R4 Geometric Cognitive AI: In-Browser WebGPU Neural Substrate with 8D Gosset E8 Lattice & Hopf Phase Telemetry"
repository = "https://github.com/Casey-allard/uor-r4-wasm-chat"
license = "MIT"
default-run = "uor"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2.92"

[profile.release]
opt-level = "z"      # Optimize specifically for minimal binary footprint
lto = true           # Enable Link-Time Optimization
codegen-units = 1    # Force single code-generation unit to allow compiler vectorisation
panic = "abort"      # Strip stack trace unwinding code

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

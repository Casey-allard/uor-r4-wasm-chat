name: UOR-R4 WASM CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test WASM Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Compile WASM Module
        # Compiles the Rust module using wasm-bindgen target 'web' for direct browser imports
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Setup Python for Model Packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Dashboard Bundle & Static Assets
        # Consolidates index.html, pkg/, assets/ into distribution workspace
        run: |
          mkdir -p dist
          cp index.html dist/
          cp coi-serviceworker.js dist/ 2>/dev/null || true
          cp -r pkg dist/
          cp -r assets dist/ 2>/dev/null || true

      - name: Download, Compile & Package Static Weights for GitHub Pages CDN
        # Downloads quantized neural weights and generates static /v1/models endpoint
        run: |
          pip install huggingface_hub
          python3 scripts/package_models.py

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Artifacts
        id: deployment
        uses: actions/deploy-pages@v4

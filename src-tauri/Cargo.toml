[package]
name = "uor-r4-sovereign-studio"
version = "3.0.0"
description = "UOR-R4 Sovereign AI Developer Studio - Desktop Edition"
edition = "2021"
default-run = "uor-r4-sovereign-studio"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "test_tauri_backend"
path = "src/bin/test_tauri_backend.rs"

[package]
name = "uor-hermes-desktop"
version = "2.0.0"
description = "UOR-R4 Sovereign AI & Hermes Studio Native Desktop App"
edition = "2021"

[lib]
name = "uor_hermes_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower = "0.4"
regex = "1.10"
futures = "0.3"
async-stream = "0.3"
chrono = "0.4"
uor_r4_wasm_bridge = { path = ".." }
